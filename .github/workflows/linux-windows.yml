# Builds and packages the Linux and Windows versions and draws the main menu headlessly on
# each, so a screenshot from every run can be compared with the Mac's.
name: Linux and Windows

on:
  push:
    branches: [linux-windows]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL 3, libmpv and Mesa
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y libsdl3-dev libmpv-dev libgl-dev libegl-dev libgl1-mesa-dri fonts-dejavu-core xz-utils
      - name: Build
        run: Portable/scripts/build-linux.sh
      - name: Draw the main menu
        run: |
          printf 'wait 5\nshot %s/menu.png\ndown\nwait 1.5\nshot %s/tv.png\nquit\n' "$PWD" "$PWD" > script.txt
          SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy FIRSTROW_NO_AUDIO=1 FIRSTROW_HARNESS=1 \
            FIRSTROW_WINDOW_SIZE=1280x720 FIRSTROW_SCALE=1 FIRSTROW_SCRIPT=script.txt \
            timeout 120 dist/linux/FirstRow/first-row
          test -f menu.png && test -f tv.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            menu.png
            tv.png
            dist/linux/FirstRow-linux-*.tar.xz

  # The small libmpv the Windows package carries, built from source (kept from run to run
  # until the script that builds it changes).
  libmpv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: libmpv
        with:
          path: Portable/build/libmpv/x64
          key: libmpv-x64-${{ hashFiles('Portable/scripts/build-libmpv-windows.sh') }}
      - name: Build libmpv for Windows
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config make
          pipx install meson
          LIBMPV_BUILD_DIR="$RUNNER_TEMP/libmpv" Portable/scripts/build-libmpv-windows.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-x64
          path: Portable/build/libmpv/x64

  windows:
    runs-on: windows-latest
    needs: libmpv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-x64
          path: Portable/build/libmpv/x64
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          Portable/scripts/build-windows.ps1
          Portable/scripts/check-windows-dlls.ps1
      - name: Draw the main menu with Mesa's software OpenGL
        shell: pwsh
        run: |
          # The runner has no GPU, so a copy of the app gets llvmpipe from MSYS2's Mesa.
          Copy-Item dist\windows\FirstRow smoke -Recurse
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-clang-x86_64-mesa | Out-Null
          Copy-Item C:\msys64\clang64\bin\*.dll smoke\ -Exclude SDL3.dll
          "wait 5`nshot $PWD\menu.png`ndown`nwait 1.5`nshot $PWD\tv.png`nquit" | Set-Content script.txt
          $env:FIRSTROW_HARNESS = "1"; $env:FIRSTROW_NO_AUDIO = "1"; $env:SDL_AUDIO_DRIVER = "dummy"
          $env:FIRSTROW_WINDOW_SIZE = "1280x720"; $env:FIRSTROW_SCALE = "1"; $env:FIRSTROW_SCRIPT = "$PWD\script.txt"
          $env:FIRSTROW_WINDOWED = "1"; $env:GALLIUM_DRIVER = "llvmpipe"
          $process = Start-Process "smoke\First Row.exe" -PassThru -RedirectStandardError stderr.txt -RedirectStandardOutput stdout.txt
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "First Row did not finish" }
          Get-Content stdout.txt, stderr.txt
          "Exit code: 0x{0:X8}" -f $process.ExitCode
          if (-not (Test-Path menu.png) -or -not (Test-Path tv.png)) { throw "First Row didn't draw both screens" }
      - name: Play the intro movie through libmpv
        shell: pwsh
        run: |
          # (The one movie the source has: three seconds into it, a picture of what is showing.)
          "wait 3`nshot $PWD\intro.png`nwait 1`nquit" | Set-Content script.txt
          $env:FIRSTROW_HARNESS = "1"; $env:FIRSTROW_HARNESS_INTRO = "1"; $env:FIRSTROW_NO_AUDIO = "1"; $env:SDL_AUDIO_DRIVER = "dummy"
          $env:FIRSTROW_WINDOW_SIZE = "1280x720"; $env:FIRSTROW_SCALE = "1"; $env:FIRSTROW_SCRIPT = "$PWD\script.txt"
          $env:FIRSTROW_WINDOWED = "1"; $env:GALLIUM_DRIVER = "llvmpipe"
          $process = Start-Process "smoke\First Row.exe" -PassThru -RedirectStandardError intro-stderr.txt -RedirectStandardOutput intro-stdout.txt
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "First Row did not finish" }
          Get-Content intro-stdout.txt, intro-stderr.txt
          "Exit code: 0x{0:X8}" -f $process.ExitCode
          if ($process.ExitCode -ne 0 -or -not (Test-Path intro.png)) { throw "First Row didn't get through its intro movie" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            menu.png
            tv.png
            intro.png
            dist/windows/FirstRow-windows-x64.zip
